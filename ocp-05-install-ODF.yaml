---
- name: Install ODF Operator
  hosts: localhost
  gather_facts: no
  connection: local
  collections:
    - kubernetes.core
    - community.general
  vars:
    validate_certs: false
    cluster_id: ""
    kubeconfig_b64: ""
    kubeconfig_path: "/tmp/kubeconfig"
    odf_namespace: openshift-storage
  tasks:
    - name: Fail if kubeconfig is empty
      fail:
        msg: "EMPTY KUBECONFIG"
      when: kubeconfig_b64 is not defined or kubeconfig_b64 | trim == ""

    - name: Create kubeconfig file
      copy:
        content: "{{ kubeconfig_b64 | trim | b64decode }}"
        dest: "{{ kubeconfig_path }}"
        mode: "0600"

    - name: Ensure ODF Namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        validate_certs: "{{ validate_certs }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ odf_namespace }}"
            labels:
              openshift.io/cluster-monitoring: "true"
              pod-security.kubernetes.io/enforce: privileged
              pod-security.kubernetes.io/audit: privileged
              pod-security.kubernetes.io/warn: privileged
            annotations:
              openshift.io/node-selector: ""

    - name: Create OperatorGroup for ODF
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        validate_certs: "{{ validate_certs }}"
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-storage-operatorgroup
            namespace: openshift-storage
            annotations:
              olm.providedAPIs: 'BackingStore.v1alpha1.noobaa.io,Backup.v1.postgresql.cnpg.noobaa.io,BucketClass.v1alpha1.noobaa.io,CSIAddonsNode.v1alpha1.csiaddons.openshift.io,CephBlockPool.v1.ceph.rook.io,CephBlockPoolRadosNamespace.v1.ceph.rook.io,CephBucketNotification.v1.ceph.rook.io,CephBucketTopic.v1.ceph.rook.io,CephCOSIDriver.v1.ceph.rook.io,CephClient.v1.ceph.rook.io,CephCluster.v1.ceph.rook.io,CephConnection.v1.csi.ceph.io,CephConnection.v1alpha1.csi.ceph.io,CephFilesystem.v1.ceph.rook.io,CephFilesystemMirror.v1.ceph.rook.io,CephFilesystemSubVolumeGroup.v1.ceph.rook.io,CephNFS.v1.ceph.rook.io,CephObjectRealm.v1.ceph.rook.io,CephObjectStore.v1.ceph.rook.io,CephObjectStoreUser.v1.ceph.rook.io,CephObjectZone.v1.ceph.rook.io,CephObjectZoneGroup.v1.ceph.rook.io,CephRBDMirror.v1.ceph.rook.io,ClientProfile.v1.csi.ceph.io,ClientProfile.v1alpha1.csi.ceph.io,ClientProfileMapping.v1.csi.ceph.io,ClientProfileMapping.v1alpha1.csi.ceph.io,Cluster.v1.postgresql.cnpg.noobaa.io,ClusterImageCatalog.v1.postgresql.cnpg.noobaa.io,Database.v1.postgresql.cnpg.noobaa.io,Driver.v1.csi.ceph.io,Driver.v1alpha1.csi.ceph.io,EncryptionKeyRotationCronJob.v1alpha1.csiaddons.openshift.io,EncryptionKeyRotationJob.v1alpha1.csiaddons.openshift.io,FailoverQuorum.v1.postgresql.cnpg.noobaa.io,ImageCatalog.v1.postgresql.cnpg.noobaa.io,NamespaceStore.v1alpha1.noobaa.io,NetworkFence.v1alpha1.csiaddons.openshift.io,NetworkFenceClass.v1alpha1.csiaddons.openshift.io,NooBaa.v1alpha1.noobaa.io,NooBaaAccount.v1alpha1.noobaa.io,OCSInitialization.v1.ocs.openshift.io,ObjectBucket.v1alpha1.objectbucket.io,ObjectBucketClaim.v1alpha1.objectbucket.io,OperatorConfig.v1.csi.ceph.io,OperatorConfig.v1alpha1.csi.ceph.io,Pooler.v1.postgresql.cnpg.noobaa.io,Publication.v1.postgresql.cnpg.noobaa.io,Recipe.v1alpha1.ramendr.openshift.io,ReclaimSpaceCronJob.v1alpha1.csiaddons.openshift.io,ReclaimSpaceJob.v1alpha1.csiaddons.openshift.io,ScheduledBackup.v1.postgresql.cnpg.noobaa.io,StorageAutoScaler.v1.ocs.openshift.io,StorageClient.v1alpha1.ocs.openshift.io,StorageCluster.v1.ocs.openshift.io,StorageClusterPeer.v1.ocs.openshift.io,StorageConsumer.v1alpha1.ocs.openshift.io,Subscription.v1.postgresql.cnpg.noobaa.io,VolumeGroupReplication.v1alpha1.replication.storage.openshift.io,VolumeGroupReplicationClass.v1alpha1.replication.storage.openshift.io,VolumeGroupReplicationContent.v1alpha1.replication.storage.openshift.io,VolumeGroupSnapshot.v1beta1.groupsnapshot.storage.openshift.io,VolumeGroupSnapshotClass.v1beta1.groupsnapshot.storage.openshift.io,VolumeGroupSnapshotContent.v1beta1.groupsnapshot.storage.openshift.io,VolumeReplication.v1alpha1.replication.storage.openshift.io,VolumeReplicationClass.v1alpha1.replication.storage.openshift.io'
          spec:
            targetNamespaces:
              - openshift-storage
            upgradeStrategy: Default

    - name: Create ODF Subscription
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        validate_certs: "{{ validate_certs }}"
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: odf-operator
            namespace: "{{ odf_namespace }}"
          spec:
            channel: stable-4.20
            installPlanApproval: Automatic
            name: odf-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace

    - name: Wait for Operator to Install
      pause:
        minutes: 5

