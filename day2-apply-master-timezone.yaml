---
- name: Apply master Timezone
  hosts: localhost
  gather_facts: no
  connection: local
  collections:
    - kubernetes.core
    - community.general
  vars:
    ldap_user: ""
    ldap_password: ""
    validate_certs: false
    cluster_id: ""
    kubeconfig_b64: ""
  tasks:
    - name: fail if kubeconfig is empty 
      fail:
        msg: "EMPTY"
      when: kubeconfig_b64 is not defined or kubeconfig_b64 | trim == ""
    - name: create kubeconfig file
      copy:
        content: "{{ kubeconfig_b64 | trim | b64decode }}"
        dest: "/tmp/kubeconfig"
        mode: "0600"



    - name: Apply timezone machineConfig 
      kubernetes.core.k8s:
        state: present
        kubeconfig: "/tmp/kubeconfig"
        verify_ssl: "false"
        definition:
          apiVersion: machineconfiguration.openshift.io/v1
          kind: MachineConfig
          metadata:
            name: 41-master-timezone-config
            labels:
              machineconfiguration.openshift.io/role: worker
              controlled-by: ansible
          spec:
            config:
              storage:
                files:
                  - mode: 420
                    path: /etc/chrony.conf
                    overwrite: true
                    contents:
                      source: "data:text/plain;charset=utf-8;base64,c2VydmVyIDEwLjEuNDQuMTUwIGlidXJzdApkcmlmdGZpbGUgL3Zhci9saWIvY2hyb255L2RyaWZ0Cm1ha2VzdGVwIDEuMCAzCnJ0Y3N5bmMKbG9nZGlyIC92YXIvbG9nL2Nocm9ueQo="
            ignition:
              version: 3.5.0