---
- name: apply-ldap-bind-secret
  hosts: localhost
  gather_facts: no
  connection: local
  collections:
    - kubernetes.core
    - community.general
  vars:
    ldap_user: ""
    ldap_password: ""
    validate_certs: false
    cluster_id: ""
    kubeconfig_b64: ""

  tasks:
    - name: fail if kubeconfig is empty 
      fail:
        msg: "EMPTY"
      when: kubeconfig_b64 is not defined or kubeconfig_b64 | trim == ""
    - name: create kubeconfig file
      copy:
        content: "{{ kubeconfig_b64 | trim | b64decode }}"
        dest: "/tmp/kubeconfig"
        mode: "0600"

    - name: Create LDAP Secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "/tmp/kubeconfig"
        validate_certs: "{{ validate_certs }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: aramco-ldap-password
            namespace: openshift-config
          type: Opaque
          data:
            bindPassword: "MmRDbk5EUkhyRFpVXX07UEFoY01oKnRyVWFdS0A7Nz0wRTF3N05CdmVKRisqZ1BYWTo="
