---
- name: Apply DNS and Image Registry Infra Placememnt
  hosts: localhost
  gather_facts: no
  connection: local
  collections:
    - kubernetes.core
    - community.general
  vars:
    ldap_user: ""
    ldap_password: ""
    validate_certs: false
    cluster_id: ""
    kubeconfig_b64: ""
  tasks:
    - name: fail if kubeconfig is empty 
      fail:
        msg: "EMPTY"
      when: kubeconfig_b64 is not defined or kubeconfig_b64 | trim == ""
    - name: create kubeconfig file
      copy:
        content: "{{ kubeconfig_b64 | trim | b64decode }}"
        dest: "/tmp/kubeconfig"
        mode: "0600"
    - name: Set DNS toleration
      kubernetes.core.k8s:
        state: patched
        kubeconfig: "/tmp/kubeconfig"
        verify_ssl: "false"
        kind: DNS
        name: default
        definition:
          spec:
            nodePlacement:
              tolerations:
                - operator: Exists
    - name: Set Image Registry NodeSelector
      kubernetes.core.k8s:
        state: patched
        kubeconfig: "/tmp/kubeconfig"
        verify_ssl: "false"
        api_version: imageregistry.operator.openshift.io/v1
        kind: Config
        name: cluster
        definition:
          spec:
            nodeSelector:
              node-role.kubernetes.io/infra: ""