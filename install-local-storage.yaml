---
- name: Install Local Storage Operator
  hosts: localhost
  gather_facts: no
  collections:
    - kubernetes.core
  vars:
    cluster_name: "s01"
    ldap_user: "{{ ansible_user }}"
    ldap_password: "{{ ansible_password }}"
    validate_certs: false
  tasks:
    - name: Set cluster_api based on cluster_name
      set_fact:
        cluster_api: |
          {% if cluster_name == 'ibmdev' %}
          https://api.{{ cluster_name }}.aramco.com:6443
          {% else %}
          https://api.{{ cluster_name }}.aramco.com.sa:6443
          {% endif %}
    - name: Login to paashub
      command: >
        oc login {{ cluster_api }} -u {{ ldap_user }} -p {{ ldap_password }} --insecure-skip-tls-verify
      register: cluster_token
      failed_when: false
      no_log: true
      changed_when: false
    - name: Get Token of automation user
      command: oc whoami -t
      register: cluster_token
      changed_when: false
      failed_when: false
      no_log: true
    - name: set token cleaner
      ansible.builtin.set_fact:
        openshift_cluster_token: "{{ cluster_token.stdout | trim }}"
    - name: Create namespace
      kubernetes.core.k8s:
        host: "{{ cluster_api }}"
        api_key: "{{ openshift_cluster_token }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openshift-local-storage
          labels:
            openshift.io/cluster-monitoring: "true"


    - name: Create OperatorGroup
      kubernetes.core.k8s:
        host: "{{ cluster_api }}"
        api_key: "{{ openshift_cluster_token }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: local-operator-group
            namespace: openshift-local-storage
          spec:
            targetNamespaces:
              - openshift-local-storage

    - name: Create Subscription
      kubernetes.core.k8s:
        host: "{{ cluster_api }}"
        api_key: "{{ openshift_cluster_token }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: local-operator-group
            namespace: openshift-local-storage
          spec:
            channel: stable
            installPlanApproval: Automatic
            name: local-operator-group
            source: redhat-operators
            sourceNamespace: openshift-marketplace
